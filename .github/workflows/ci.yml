name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentcore
          POSTGRES_PASSWORD: agentcore
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcore -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: agentcore
      POSTGRES_USER: agentcore
      POSTGRES_PASSWORD: agentcore
      POSTGRES_SSL_MODE: disable
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DATABASE: agentcore_test
      TEST_POSTGRES_USER: agentcore
      TEST_POSTGRES_PASSWORD: agentcore
      TEST_POSTGRES_SSL_MODE: disable
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the onboarding gate inspects commits since main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:test:prepare
      # The seed must be repeatable: running it twice checks idempotency.
      - run: pnpm db:test:seed
      - run: pnpm db:test:seed
      - run: pnpm db:test:drift
      - run: pnpm lint
      # Universality gate: domain-onboarding commits must not touch the core.
      - run: pnpm check:onboarding
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      # Phase 7.2 quality gate: scripted + action-lifecycle evaluation,
      # coverage per pack/locale/risk group, zero false success claims.
      - run: pnpm test:eval
      - run: pnpm test:coverage
      - run: pnpm format:check
      - run: pnpm build
      # Browser end-to-end tests: real Chromium against the built API and web
      # app and the isolated agentcore_test database.
      - run: pnpm --filter @agentcore/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

  # Supply-chain gates (audit 2026-11-10, P0.4): advisories in production
  # dependencies (accepted exceptions live in package.json pnpm.auditConfig,
  # each with a reason in docs/audit/2026-11-10/AGENTCORE_SECURITY_AND_PRODUCTION_REVIEW.md)
  # and secrets committed to the tree.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Production dependencies have no high or critical advisory
        run: pnpm audit --prod --audit-level=high
      - name: No secrets in the tree (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  # Production images (ADR 035) must keep building; nothing is pushed here.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the api, web and migrate images
        run: |
          for target in api web migrate; do
            docker build -f Dockerfile.production --target "$target" -t "tezda-$target:ci" .
          done
      - name: The api and web images run as a non-root user
        run: |
          for target in api web; do
            test "$(docker run --rm --entrypoint id "tezda-$target:ci" -un)" = node
          done
      - name: No fixable critical CVE in the images (Trivy)
        run: |
          for target in api web migrate; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
              aquasec/trivy:0.57.1 image --ignorefile /.trivyignore.yaml --severity CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress --quiet --format template \
              --template '{{ range . }}{{ $t := .Target }}{{ range .Vulnerabilities }}{{ "'"$target"'" }} {{ $t }} {{ .PkgPath }}: {{ .PkgName }}@{{ .InstalledVersion }} {{ .VulnerabilityID }} fixed in {{ .FixedVersion }}{{ "\n" }}{{ end }}{{ end }}' \
              "tezda-$target:ci"
          done

  # Staging deploy (ADR 035 step 6): only a push to the staging branch, only
  # after the checks above pass. Images are built once per commit on an arm64
  # runner (the host is arm64) and tagged with the short commit id.
  publish:
    # Runs once the owner set AWS_DEPLOY_ROLE_ARN (deploy/aws/github-deploy-role.sh).
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/production-pilot' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [quality, images, security]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the api, web and migrate images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          repo="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/tezda"
          for target in api web migrate; do
            docker build -f Dockerfile.production --target "$target" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$repo-$target:$TAG" .
            docker push "$repo-$target:$TAG"
          done

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Assume the deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Deploy the tag on the host through SSM
        run: |
          script="curl -fsSLo /root/bootstrap-staging.sh https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/deploy/bootstrap-staging.sh && TEZDA_BRANCH=${GITHUB_REF_NAME} sh /root/bootstrap-staging.sh ${DOMAIN} ${TAG}"
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG} from ${GITHUB_RUN_ID}" \
            --parameters "$(jq -nc --arg c "$script" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | grep -vE 'Pulling|Pulled|Waiting|Download|Extract|Verifying' | tail -n 15
          test "$status" = Success
      - name: The site answers
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/login")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/api/v1/auth/me")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/health")" = 404
