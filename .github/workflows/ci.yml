name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentcore
          POSTGRES_PASSWORD: agentcore
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcore -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: agentcore
      POSTGRES_USER: agentcore
      POSTGRES_PASSWORD: agentcore
      POSTGRES_SSL_MODE: disable
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DATABASE: agentcore_test
      TEST_POSTGRES_USER: agentcore
      TEST_POSTGRES_PASSWORD: agentcore
      TEST_POSTGRES_SSL_MODE: disable
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the onboarding gate inspects commits since main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:test:prepare
      # The seed must be repeatable: running it twice checks idempotency.
      - run: pnpm db:test:seed
      - run: pnpm db:test:seed
      - run: pnpm db:test:drift
      - run: pnpm lint
      # Universality gate: domain-onboarding commits must not touch the core.
      - run: pnpm check:onboarding
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      # Phase 7.2 quality gate: scripted + action-lifecycle evaluation,
      # coverage per pack/locale/risk group, zero false success claims.
      - run: pnpm test:eval
      - run: pnpm test:coverage
      - name: Diagnose Prettier output for ledger integration test
        run: |
          pnpm --filter @agentcore/api exec prettier --config ../../packages/config/prettier.json --write src/agent/llm-budget-ledger.integration.spec.ts
          git diff -- apps/api/src/agent/llm-budget-ledger.integration.spec.ts
      - run: pnpm format:check
      - run: pnpm build
      # Browser end-to-end tests: real Chromium against the built API and web
      # app and the isolated agentcore_test database.
      - run: pnpm --filter @agentcore/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
